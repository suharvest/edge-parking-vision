<!DOCTYPE html>
<!--
NRD-4 车位编辑 + 实时状态页（GET /slots/editor）。原生 JS + canvas，无框架无构建。
- 背景为实时画面：每秒取 /preview.jpg?stream=（X-Frame-Seq）与同一帧的 /preview.json?seq=，
  后者在 slots 预设下给出每个车位的当前状态（occupied / free / unknown）；
- 在空白处拖出矩形新建车位，再拖 4 个角贴合透视；也可「逐点画」点 4 个角；
- 车位 id 在右侧列表内直接改，逐个删除；
- 保存：客户端校验（≥3 顶点、凸、id 唯一）后 PUT /config/slots（只提交当前流），
  服务端再校验、原子写 state_dir/slots.override.json、即时重配；重启后 SlotsApp.configure
  读回 override。
坐标一律 0–1 源归一化，与 slots.schema.json / slot_coverage 配置一致。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-parking 车位</title>
<style>
  :root { --bg: #15171a; --panel: #1f2226; --line: #30343a; --fg: #eceef1;
          --dim: #9aa0a6; --ok: #4dff88; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif;
         margin: 0; background: var(--bg); color: var(--fg); }
  header { padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .hint { font-size: 13px; color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px;
         padding: 16px; align-items: start; }
  .stage { position: relative; background: #000; line-height: 0; }
  .stage img { display: block; width: 100%; height: auto; min-height: 200px; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                  cursor: crosshair; touch-action: none; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  aside h2 { font-size: 14px; margin: 0; color: var(--dim); font-weight: 500; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: #262a2f; border-radius: 6px; padding: 10px 12px; }
  .tile .k { font-size: 13px; color: var(--dim); }
  .tile .v { font-size: 38px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .v.ok { color: var(--ok); } .v.bad { color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select, input { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 6px;
           border: 1px solid var(--line); background: #2b3036; color: var(--fg); }
  button { cursor: pointer; }
  button.primary { background: #2f7d4f; border-color: #3a9a61; }
  button.active { border-color: #ffcf4d; color: #ffcf4d; }
  button:disabled { opacity: .5; cursor: default; }
  ul.bays { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
  ul.bays li { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 8px; align-items: center;
               padding: 6px 4px; border-bottom: 1px solid var(--line); border-radius: 4px; }
  ul.bays li.sel { background: #2b3440; }
  ul.bays li input { width: 100%; padding: 4px 6px; background: #111316; }
  ul.bays .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
  ul.bays .dot.occupied { background: var(--bad); } ul.bays .dot.free { background: var(--ok); }
  .st { font-size: 13px; color: var(--dim); }
  ul.bays button { padding: 3px 9px; font-size: 13px; }
  .msg { font-size: 13px; color: var(--dim); min-height: 1.2em; white-space: pre-wrap; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>车位占用 · Parking bays</h1>
  <label class="row">摄像头 Camera <select id="stream"></select></label>
  <span class="hint" id="hint">空白处拖动画矩形新建车位，拖动角点贴合车位 · Drag on an empty area to add a bay, drag its corners to fit</span>
</header>
<main>
  <div class="stage">
    <img id="frame" alt="camera frame">
    <canvas id="cv"></canvas>
  </div>
  <aside>
    <h2>实时状态 · Live status</h2>
    <div class="tiles">
      <div class="tile"><div class="k">占用 Occupied</div><div class="v bad" id="nOcc">-</div></div>
      <div class="tile"><div class="k">空闲 Free</div><div class="v ok" id="nFree">-</div></div>
    </div>
    <h2>车位 · Bays</h2>
    <ul class="bays" id="list"></ul>
    <div class="row">
      <button id="clickMode">逐点画 · Click corners</button>
      <button id="revert">撤销修改 · Revert</button>
    </div>
    <div class="row"><button id="save" class="primary" disabled>保存 · Save</button></div>
    <div class="msg" id="msg"></div>
  </aside>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const img = $("frame"), cv = $("cv"), g = cv.getContext("2d");
let streamId = null;
let saved = {};          // GET /config/slots：{stream: [{id, polygon}]}
let slots = [];          // 当前流编辑中的车位
let states = {};         // id → {state, cover}（来自 /preview.json）
let sel = -1, dirty = false;
let clickPts = null;     // 逐点画模式下已点的角
let drag = null;         // {kind: "new"|"corner"|"move", ...}
let pendingStates = null, frameUrl = null;

const msg = (t, cls) => { $("msg").textContent = t; $("msg").className = "msg " + (cls || ""); };
const clone = (o) => JSON.parse(JSON.stringify(o));
const sq = () => "?stream=" + encodeURIComponent(streamId);
function markDirty(v) { dirty = v; $("save").disabled = !v; }

function isConvex(poly) {
  let sign = 0;
  for (let i = 0; i < poly.length; i++) {
    const [ax, ay] = poly[i], [bx, by] = poly[(i + 1) % poly.length], [cx, cy] = poly[(i + 2) % poly.length];
    const z = (bx - ax) * (cy - by) - (by - ay) * (cx - bx);
    if (Math.abs(z) < 1e-9) return false;
    if (sign === 0) sign = Math.sign(z); else if (Math.sign(z) !== sign) return false;
  }
  return true;
}
function inside(poly, p) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function nextId() {
  const ids = new Set(slots.map((s) => s.id));
  for (let n = slots.length + 1; ; n++) { const id = "P" + String(n).padStart(2, "0"); if (!ids.has(id)) return id; }
}

let placed = [];          // 本帧已放的标签矩形，避免相邻车位标签互相压住
function hits(r) { return placed.some((q) => r.x < q.x + q.w && q.x < r.x + r.w && r.y < q.y + q.h && q.y < r.y + r.h); }
function label(text, x, yTop, yBottom, color) {
  const fs = Math.max(16, Math.round(cv.width / 50));
  g.font = `600 ${fs}px system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif`;
  const padX = Math.round(fs * 0.45), padY = Math.round(fs * 0.28);
  const w = g.measureText(text).width + padX * 2, h = fs + padY * 2, gap = Math.round(fs * 0.25);
  const lx = Math.min(Math.max(0, x - w / 2), cv.width - w);
  // 候选：多边形上方 → 下方 → 继续向上错开；都放不下时退回上方
  const cands = [yTop - gap - h, yBottom + gap];
  for (let k = 1; k <= 6; k++) cands.push(yTop - gap - h - k * (h + 2));
  let y = null;
  for (const c of cands) {
    if (c < 0 || c + h > cv.height) continue;
    if (!hits({ x: lx, y: c, w, h })) { y = c; break; }
  }
  if (y == null) y = Math.min(Math.max(0, yTop - gap - h), cv.height - h);
  placed.push({ x: lx, y, w, h });
  g.fillStyle = "rgba(10, 12, 14, 0.78)"; g.fillRect(lx, y, w, h);
  g.fillStyle = color; g.textBaseline = "top"; g.fillText(text, lx + padX, y + padY);
}

function draw() {
  cv.width = img.naturalWidth || 1280; cv.height = img.naturalHeight || 720;
  const W = cv.width, H = cv.height, lw = Math.max(2, Math.round(W / 480));
  g.clearRect(0, 0, W, H);
  placed = [];
  slots.forEach((s, i) => {
    const pts = s.polygon.map(([x, y]) => [x * W, y * H]);
    const st = (states[s.id] || {}).state || "unknown";
    const fill = st === "occupied" ? "rgba(230, 60, 60, 0.38)" : st === "free" ? "rgba(60, 205, 110, 0.32)" : "rgba(150, 150, 150, 0.30)";
    const stroke = st === "occupied" ? "#ff5a5a" : st === "free" ? "#4dff88" : "#b8b8b8";
    g.beginPath(); pts.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
    g.fillStyle = fill; g.fill();
    g.strokeStyle = i === sel ? "#ffcf4d" : stroke; g.lineWidth = i === sel ? lw + 1 : lw; g.stroke();
    const ys = pts.map((p) => p[1]), xs = pts.map((p) => p[0]);
    const word = st === "occupied" ? "占用" : st === "free" ? "空闲" : "未知";
    label(`${s.id} ${word}`, (Math.min(...xs) + Math.max(...xs)) / 2, Math.min(...ys), Math.max(...ys), stroke);
    if (i === sel) {
      const r = Math.max(6, Math.round(W / 140));
      for (const [x, y] of pts) {
        g.fillStyle = "#ffcf4d"; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#15171a"; g.lineWidth = 2; g.stroke();
      }
    }
  });
  if (clickPts && clickPts.length) {
    g.strokeStyle = "#ffcf4d"; g.lineWidth = lw; g.setLineDash([8, 6]);
    g.beginPath(); clickPts.forEach(([x, y], k) => (k ? g.lineTo(x * W, y * H) : g.moveTo(x * W, y * H))); g.stroke();
    g.setLineDash([]);
    for (const [x, y] of clickPts) { g.fillStyle = "#ffcf4d"; g.beginPath(); g.arc(x * W, y * H, 6, 0, Math.PI * 2); g.fill(); }
  }
  renderPanel();
}

function renderPanel() {
  let occ = 0, free = 0;
  for (const s of slots) { const st = (states[s.id] || {}).state; if (st === "occupied") occ++; else if (st === "free") free++; }
  $("nOcc").textContent = occ; $("nFree").textContent = free;
  const list = $("list");
  if (document.activeElement && list.contains(document.activeElement)) return;  // 正在改 id 时不重建
  list.innerHTML = "";
  slots.forEach((s, i) => {
    const st = (states[s.id] || {}).state || "unknown";
    const li = document.createElement("li");
    if (i === sel) li.className = "sel";
    li.innerHTML = `<span class="dot ${st}"></span><input aria-label="bay id"><span class="st">${
      st === "occupied" ? "占用" : st === "free" ? "空闲" : "未知"}</span><button title="删除 · Delete" aria-label="删除 · Delete">✕</button>`;
    const inp = li.querySelector("input");
    inp.value = s.id;
    inp.onfocus = () => { sel = i; draw(); };
    inp.onchange = () => { s.id = inp.value.trim(); markDirty(true); inp.blur(); draw(); };
    li.querySelector("button").onclick = () => { slots.splice(i, 1); sel = -1; markDirty(true); draw(); };
    li.onclick = (e) => { if (e.target.tagName !== "BUTTON" && e.target.tagName !== "INPUT") { sel = i; draw(); } };
    list.appendChild(li);
  });
  if (!slots.length) list.innerHTML = `<li><span></span><span class="st">尚无车位 · No bays yet</span></li>`;
}

// ---- 鼠标交互
const clamp = (v) => Math.min(1, Math.max(0, v));
function normPt(e) { const r = cv.getBoundingClientRect(); return [clamp((e.clientX - r.left) / r.width), clamp((e.clientY - r.top) / r.height)]; }
function pxDist(a, b) { const r = cv.getBoundingClientRect(); return Math.hypot((a[0] - b[0]) * r.width, (a[1] - b[1]) * r.height); }

cv.addEventListener("pointerdown", (e) => {
  const p = normPt(e);
  if (clickPts) {
    if (clickPts.length >= 3 && pxDist(p, clickPts[0]) < 14) return finishClick();
    clickPts.push(p);
    if (clickPts.length === 4) return finishClick();
    return draw();
  }
  if (sel >= 0) {
    const k = slots[sel].polygon.findIndex((q) => pxDist(q, p) < 14);
    if (k >= 0) { drag = { kind: "corner", k }; cv.setPointerCapture(e.pointerId); return; }
  }
  const hit = slots.findIndex((s) => inside(s.polygon, p));
  if (hit >= 0) {
    sel = hit; drag = { kind: "move", last: p };
  } else {
    sel = -1; drag = { kind: "new", start: p };
  }
  cv.setPointerCapture(e.pointerId);
  draw();
});
cv.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = normPt(e);
  if (drag.kind === "corner") { slots[sel].polygon[drag.k] = p; markDirty(true); }
  else if (drag.kind === "move") {
    const dx = p[0] - drag.last[0], dy = p[1] - drag.last[1];
    if (dx || dy) {
      slots[sel].polygon = slots[sel].polygon.map(([x, y]) => [clamp(x + dx), clamp(y + dy)]);
      drag.last = p; markDirty(true);
    }
  } else if (drag.kind === "new" && pxDist(p, drag.start) > 10) {
    const [x0, y0] = drag.start;
    if (drag.index == null) { slots.push({ id: nextId(), polygon: [] }); drag.index = slots.length - 1; sel = drag.index; }
    slots[drag.index].polygon = [[x0, y0], [p[0], y0], [p[0], p[1]], [x0, p[1]]];
    markDirty(true);
  }
  draw();
});
cv.addEventListener("pointerup", () => {
  if (drag && drag.kind === "new" && drag.index != null) {
    const s = slots[drag.index];
    if (!isConvex(s.polygon)) { slots.splice(drag.index, 1); sel = -1; }
    else s.polygon = orient(s.polygon);
  }
  if (drag && sel >= 0 && slots[sel] && !isConvex(slots[sel].polygon))
    msg(`车位 ${slots[sel].id} 不是凸四边形，请调整角点 · Bay ${slots[sel].id} is not convex, adjust its corners`, "err");
  drag = null; draw();
});
function orient(poly) {   // 统一为顺时针（图像坐标），角点顺序稳定
  let a = 0; for (let i = 0; i < poly.length; i++) { const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length]; a += x0 * y1 - x1 * y0; }
  return a < 0 ? poly.slice().reverse() : poly;
}
function finishClick() {
  const poly = clickPts; clickPts = null; $("clickMode").classList.remove("active");
  if (poly.length >= 3 && isConvex(poly)) { slots.push({ id: nextId(), polygon: orient(poly) }); sel = slots.length - 1; markDirty(true); }
  else msg("角点不构成凸多边形，已取消 · Corners do not form a convex polygon, cancelled", "err");
  draw();
}
$("clickMode").onclick = () => {
  clickPts = clickPts ? null : [];
  $("clickMode").classList.toggle("active", !!clickPts);
  msg(clickPts ? "依次点击车位的 4 个角 · Click the 4 corners of the bay" : "");
  draw();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { sel = -1; clickPts = null; $("clickMode").classList.remove("active"); draw(); }
  if ((e.key === "Delete" || e.key === "Backspace") && sel >= 0 && document.activeElement.tagName !== "INPUT") {
    slots.splice(sel, 1); sel = -1; markDirty(true); draw();
  }
});

// ---- 配置读写
async function loadConfig() {
  const r = await fetch("/config/slots", { cache: "no-store" });
  if (!r.ok) throw new Error("GET /config/slots: HTTP " + r.status);
  saved = await r.json();
  const sel0 = $("stream");
  if (!sel0.options.length) {
    for (const sid of Object.keys(saved)) sel0.add(new Option(sid, sid));
    const want = new URLSearchParams(location.search).get("stream");
    if (want && saved[want]) sel0.value = want;
  }
  streamId = sel0.value || null;
  slots = clone(saved[streamId] || []);
  sel = -1; markDirty(false); draw();
}
$("stream").onchange = () => {
  if (dirty && !confirm("放弃未保存的修改？ · Discard unsaved changes?")) { $("stream").value = streamId; return; }
  streamId = $("stream").value; slots = clone(saved[streamId] || []); sel = -1; states = {}; markDirty(false); draw();
};
$("revert").onclick = () => { slots = clone(saved[streamId] || []); sel = -1; markDirty(false); msg("已恢复为当前生效配置 · Reverted"); draw(); };
$("save").onclick = async () => {
  const ids = new Set();
  for (const s of slots) {
    if (!s.id) return msg("车位 id 不能为空 · Bay id cannot be empty", "err");
    if (ids.has(s.id)) return msg(`车位 id 重复：${s.id} · Duplicate bay id: ${s.id}`, "err");
    ids.add(s.id);
    if (s.polygon.length < 3 || !isConvex(s.polygon)) return msg(`车位 ${s.id} 不是凸多边形 · Bay ${s.id} is not convex`, "err");
  }
  $("save").disabled = true;
  try {
    const r = await fetch("/config/slots", { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [streamId]: slots }) });
    const js = await r.json();
    if (!r.ok) throw new Error(js.error || ("HTTP " + r.status));
    saved = js; slots = clone(saved[streamId] || []); sel = -1; markDirty(false);
    msg("已保存并生效，重启后保留 · Saved, applied, kept across restarts", "ok");
    draw();
  } catch (e) { $("save").disabled = false; msg("保存失败 · Save failed: " + (e.message || e), "err"); }
};

// ---- 实时画面与状态：先 /preview.jpg（X-Frame-Seq），再同一帧的 /preview.json
let busy = false;
async function tick() {
  if (busy || !streamId) return;
  busy = true;
  try {
    const r = await fetch("/preview.jpg" + sq() + "&t=" + Date.now(), { cache: "no-store" });
    const seq = r.ok ? r.headers.get("X-Frame-Seq") : null;
    const blob = r.ok ? await r.blob() : null;
    const j = await fetch("/preview.json" + sq() + (seq != null ? "&seq=" + seq : ""), { cache: "no-store" });
    const next = {};
    if (j.ok) for (const s of (await j.json()).slots || []) next[s.id] = { state: s.state, cover: s.cover };
    if (blob) {
      pendingStates = next;
      const url = URL.createObjectURL(blob), prev = frameUrl;
      frameUrl = url; img.src = url; if (prev) URL.revokeObjectURL(prev);
    } else { states = next; draw(); }
  } catch (e) { /* 保留上一帧 */ } finally { busy = false; }
}
img.addEventListener("load", () => { if (pendingStates) { states = pendingStates; pendingStates = null; } draw(); });
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
loadConfig().then(tick).catch((e) => msg(String(e.message || e), "err"));
setInterval(tick, 1100);
</script>
</body>
</html>
