<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>edge-parking 预览</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #17191c; color: #e8e8e8; }
  header { padding: 8px 16px; display: flex; gap: 24px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; }
  header span { font-size: 13px; color: #9aa0a6; }
  main { position: relative; display: inline-block; margin: 0 16px 16px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #status { font-size: 12px; color: #8ab4f8; }
</style>
</head>
<body>
<header>
  <h1>edge-parking 安装取景</h1>
  <span id="occ">occupancy –</span>
  <span id="status">loading…</span>
</header>
<main>
  <img id="frame" alt="preview">
  <canvas id="overlay"></canvas>
</main>
<script>
  // §S4 /preview：每秒拉 /preview.jpg 与 /preview.json，在 canvas 上画框与计数线。
  // 服务端不画图（Python 不碰像素）；stream 参数可透传，如 ?stream=gate-a。
  const params = new URLSearchParams(location.search);
  const stream = params.get("stream") || "";
  const q = stream ? ("?stream=" + encodeURIComponent(stream)) : "";
  const img = document.getElementById("frame");
  const canvas = document.getElementById("overlay");
  const ctx2d = canvas.getContext("2d");

  // 最近一次 preview.json：图片晚于 json 到达时 load 事件用它重画，而不是清空叠加层。
  let lastJs = null;
  // /occupancy 只在计数预设存在；收到 404 后不再轮询。
  let occAvailable = true;
  let frameUrl = null;

  function drawBoxes(js) {
    if (js) lastJs = js; else js = lastJs;
    canvas.width = img.naturalWidth || 640;
    canvas.height = img.naturalHeight || 360;
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    if (!js || !js.detections) return;
    ctx2d.strokeStyle = "#4dff88";
    ctx2d.lineWidth = 2;
    ctx2d.font = "12px sans-serif";
    for (const d of js.detections) {
      const [x0, y0, x1, y1] = d.box;
      ctx2d.strokeRect(x0 * canvas.width, y0 * canvas.height,
                       (x1 - x0) * canvas.width, (y1 - y0) * canvas.height);
      ctx2d.fillStyle = "#4dff88";
      ctx2d.fillText(`#${d.track_id} ${d.score.toFixed(2)}`,
                     x0 * canvas.width + 3, y0 * canvas.height + 13);
    }
    if (js.line) {
      ctx2d.strokeStyle = "#ffcf4d";
      ctx2d.lineWidth = 3;
      ctx2d.beginPath();
      ctx2d.moveTo(js.line.a[0] * canvas.width, js.line.a[1] * canvas.height);
      ctx2d.lineTo(js.line.b[0] * canvas.width, js.line.b[1] * canvas.height);
      ctx2d.stroke();
    }
  }

  // /preview.jpg 每路限 1 次/秒（http_app._PREVIEW_MIN_INTERVAL_S），超限返回 429 JSON。
  // 先 fetch 再换图：非 200 时保留上一帧，<img> 不会显示破图。
  async function refreshFrame() {
    try {
      const r = await fetch("/preview.jpg" + q + (q ? "&" : "?") + "t=" + Date.now(),
                            { cache: "no-store" });
      if (!r.ok) return;
      const url = URL.createObjectURL(await r.blob());
      const prev = frameUrl;
      frameUrl = url;
      img.src = url;
      if (prev) URL.revokeObjectURL(prev);
    } catch (e) {
      // 网络错误：保留上一帧，状态栏由 preview.json 分支报告
    }
  }

  let busy = false;
  async function tick() {
    if (busy) return;
    busy = true;
    refreshFrame();
    try {
      const r = await fetch("/preview.json" + q, { cache: "no-store" });
      if (r.ok) {
        const js = await r.json();
        drawBoxes(js);
        document.getElementById("status").textContent =
          `seq ${js.seq ?? "-"} · ${js.detections?.length ?? 0} det · ${js.inference_ms ?? "-"} ms`;
      } else {
        document.getElementById("status").textContent = "preview.json: HTTP " + r.status;
      }
      if (occAvailable) {
        const o = await fetch("/occupancy" + q, { cache: "no-store" });
        if (o.ok) {
          const js = await o.json();
          document.getElementById("occ").textContent =
            `occupancy ${js.occupancy}/${js.capacity} · free ${js.free} · in_today ${js.in_today} · out_today ${js.out_today}`;
        } else if (o.status === 404) {
          occAvailable = false;
          document.getElementById("occ").textContent = "occupancy n/a（当前预设无计数模块）";
        }
      }
    } catch (e) {
      document.getElementById("status").textContent = "error: " + e;
    } finally {
      busy = false;
    }
  }
  img.addEventListener("load", () => drawBoxes(null));   // 用 lastJs 重画
  tick();
  // 略大于服务端 1 s 限流间隔，避免节拍抖动时周期性撞上 429
  setInterval(tick, 1100);
</script>
</body>
</html>
