# 基座镜像锁。
#
# 状态：
#   - 基座镜像 vision-base-<p> 尚未发布，digest 保持「需核实」；
#     相关两个测试（tests/test_base_images.py）在占位状态下跳过。
#   - vision_base Python 包已内置在 third_party/vision_base/（来源见其 README.md）。
#   - 镜像与 tag 发布后执行 `bash tools/check_base_images.sh --sync` 从上游锁文件填入，禁止手编 digest。
retail_vision_repo: https://github.com/Seeed-Solution/retail-vision
retail_vision_tag: "需核实"          # 应为 vision-base-v<semver>（当前基座未打 tag）
source_lock: platforms/base-images.lock.yaml      # retail-vision 同一 tag 下的锁文件，本文件各 digest 必须与之相同
bases:
  cpu:    {ref: sensecraft-missionpack.seeed.cn/solution/vision-base-cpu:需核实,    digest: "需核实"}   # 从 retail-vision 锁文件填入
  jetson: {ref: sensecraft-missionpack.seeed.cn/solution/vision-base-jetson:需核实, digest: "需核实", host_mounts: platforms/host-mounts/jetson.yaml}
  rk:     {ref: sensecraft-missionpack.seeed.cn/solution/vision-base-rk:需核实,     digest: "需核实", host_mounts: {rk3576: platforms/host-mounts/rk3576.yaml, rk3588: platforms/host-mounts/rk3588.yaml}}
  hailo:  {ref: sensecraft-missionpack.seeed.cn/solution/vision-base-hailo:需核实,  digest: "需核实", host_mounts: platforms/host-mounts/hailo.yaml, hailort_expected: "4.21.0"}
device_profiles:
  recamera-pro:  {platform_profile: rv1126b-linux-gnu-cp311-rknn232-v1, runtime_profile: recamera-ai-cp311-v1, rknn_runtime: "2.3.2", firmware_verified: "V1.0.4", vb_runtime_sha256: "需核实"}   # BASE-1 M2.4 产物
  recamera-2002: {build_container: ubuntu_dev_x86, container_image: "需核实", sdk: sg2002_recamera_emmc, toolchain: riscv64-linux-musl-x86_64, os_verified: "0.2.2", vb_runtime_sha256: "需核实"}   # BASE-1 M2.5 产物
