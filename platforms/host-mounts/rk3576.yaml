# rk3576 宿主挂载（规格 §S11.2 bases.rk.host_mounts.rk3576；§S11.3 compose 以此 ∪ 通用三项生成 volumes/devices/tmpfs）。
#
# 来源说明：上游 retail-vision 尚无 platforms/host-mounts/，本文件为本仓库整理，非上游拷贝。
# 内容按各板卡 compose 的宿主挂载项整理（内部原型，无公开来源）。
# gi 挂载的容器侧目标路径（/usr/local/lib/python3.11/site-packages）沿用原型布局，
# 与 vision-base-rk 镜像内 Python 路径是否一致需核实（BASE-1 M2.1）。
privileged: true
tmpfs:
  - /root/.cache
devices:
  - /dev/dri:/dev/dri
volumes:
  - /lib/aarch64-linux-gnu/libgstreamer-1.0.so.0:/lib/aarch64-linux-gnu/libgstreamer-1.0.so.0:ro
  - /lib/aarch64-linux-gnu/libgstbase-1.0.so.0:/lib/aarch64-linux-gnu/libgstbase-1.0.so.0:ro
  - /lib/aarch64-linux-gnu/libgstvideo-1.0.so.0:/lib/aarch64-linux-gnu/libgstvideo-1.0.so.0:ro
  - /lib/aarch64-linux-gnu/libgstallocators-1.0.so.0:/lib/aarch64-linux-gnu/libgstallocators-1.0.so.0:ro
  - /lib/aarch64-linux-gnu/gstreamer-1.0/libgstapp.so:/lib/aarch64-linux-gnu/gstreamer-1.0/libgstapp.so:ro
  - /lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so:/lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so:ro
  - /lib/aarch64-linux-gnu/gstreamer-1.0/libgstvideoparsersbad.so:/lib/aarch64-linux-gnu/gstreamer-1.0/libgstvideoparsersbad.so:ro
  - /lib/aarch64-linux-gnu/libgstcodecparsers-1.0.so.0:/lib/aarch64-linux-gnu/libgstcodecparsers-1.0.so.0:ro
  - /lib/aarch64-linux-gnu/librockchip_mpp.so.1:/lib/aarch64-linux-gnu/librockchip_mpp.so.1:ro
  - /lib/aarch64-linux-gnu/librga.so.2:/lib/aarch64-linux-gnu/librga.so.2:ro
  - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
  - /usr/lib/python3/dist-packages/gi:/usr/local/lib/python3.11/site-packages/gi:ro
