# NRD-2 P7 演示看板 telegraf 配置（规格 §8.3 P7、§S3、§S12）
# agent 不跑 host 指标，只做 MQTT -> InfluxDB 的桥
[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# ---------- 输出：InfluxDB v2 ----------
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# ---------- 输入：R1124 broker 上的 occupancy 快照（§S3） ----------
# viewer 角色：broker ACL 只允许读 +/parking/#（§S12 acl.tmpl）
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["+/parking/+/occupancy"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "edge-parking-demo-board"
  qos = 1
  connection_timeout = "30s"
  persistent_session = false
  # MQTT topic 本身存成 tag，便于按 site/camera 过滤
  topic_tag = "mqtt_topic"

  data_format = "json"
  # 信封字段（§S3 envelope.schema.json）里可作 tag 的维度
  tag_keys = ["site_id", "camera_id"]
  json_time_key = "ts"      # epoch ms
  json_time_format = "unix_ms"
  json_string_fields = ["schema", "event_id", "reason"]

# Grafana 面板查询（influxdb_v2 数据源，bucket parking）：
#   occupancy  |> filter site_id/camera_id
#   free       |> ...
#   in_today - out_today 累计趋势
