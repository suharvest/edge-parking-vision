apiVersion: 1

datasources:
  - name: InfluxDB-Parking
    uid: influxdb-parking
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    jsonData:
      version: 2
      organization: ${INFLUX_ORG}
      defaultBucket: parking
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
