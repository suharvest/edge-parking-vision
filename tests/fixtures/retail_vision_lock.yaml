# retail-vision 锁文件快照（规格 §S11.2 tests/test_base_images.py 用）。
#
# 正常流程：由 `bash tools/check_base_images.sh --sync` 从 retail-vision@<retail_vision_tag>
# 的 platforms/base-images.lock.yaml 原样拷入生成。
