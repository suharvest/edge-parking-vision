# 当前状态（X0 执行时手工建立）：retail-vision 尚未打 vision-base-v* tag，
# 仓库内也无 platforms/base-images.lock.yaml —— 上游缺失，已按 §S13 汇报。
# 本文件为占位快照，digest 保持「需核实」；tests/test_base_images.py 对
# digest 的断言按 §8.0 X0 行设计失败。上游就绪后重跑 --sync 覆盖本文件，禁止手编 digest。
