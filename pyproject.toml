# Edge parking vision: vehicle counting, plate recognition and parking slots on a shared vision base.
# vision_base (stdlib only) is vendored in third_party/vision_base/, see its README.md.
[project]
name = "edge-parking-vision"
version = "0.1.0"
description = "Edge parking vision (counting / plate / slots) on a shared vision base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0",  # 只给 tools/ 读 models/registry.yaml，不进 core_parking
    "onnx>=1.17",  # 仅 M0 模型导出/形状检查（§8.1 M0），不进 core_parking 运行时
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# wheel 包含 core_parking 与 vendored vision_base
[tool.hatch.build.targets.wheel]
packages = ["core-py/core_parking", "third_party/vision_base"]

[tool.hatch.build.targets.sdist]
include = ["core-py", "third_party/vision_base", "contracts", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
pythonpath = ["core-py", "third_party", "contracts", "."]
testpaths = ["tests"]
markers = [
    "broker: needs a real MQTT broker (VB_TEST_BROKER=host:port)",
]
